name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          sed -i \
            -e "s|__EMAILJS_PUBLIC_KEY__|${EMAILJS_PUBLIC_KEY}|" \
            -e "s|__EMAILJS_SERVICE_ID__|${EMAILJS_SERVICE_ID}|" \
            -e "s|__EMAILJS_TEMPLATE_ID__|${EMAILJS_TEMPLATE_ID}|" \
            _site/js/main.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
